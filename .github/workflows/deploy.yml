name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure target directory exists
        run: ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p /app/gateway"

      - name: Sync files via rsync
        run: |
          # --exclude='certs' 有两个作用：不上传本地的 certs/，以及让 --delete
          # 不动服务器上的 certs/（rsync 默认不删除被 exclude 的文件）。
          rsync -avz --delete --exclude='.git' --exclude='.github' --exclude='certs' \
            -e 'ssh -o ServerAliveInterval=30' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/app/gateway/

      # 必须放在 rsync 之后：要校验的是刚同步上去的 nginx.conf 引用到的证书。
      # 放 rsync 之前就成了「拿新配置去查旧文件」，加了新域名也发现不了缺证书。
      # 这里配置只是落了盘、还没生效（容器仍跑旧的），所以查完再决定要不要继续是安全的。
      - name: Preflight - 证书是否齐全
        run: ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "sh /app/gateway/check-certs.sh"

      # 用一次性容器把「即将生效的配置」验一遍再动线上容器。
      # 网关同时管着 80 和 443，起不来就是整站不通，所以宁可让部署失败，
      # 也不能把配置错误带进线上容器（这一步之后才 recreate，失败时旧容器照常服务）。
      # 三个挂载缺一不可，否则报的是「文件找不到」而不是真正的语法问题。
      - name: Preflight - nginx 配置语法
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "docker run --rm \
              -v /app/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
              -v /app/gateway/routes.inc:/etc/nginx/routes.inc:ro \
              -v /app/gateway/certs:/etc/nginx/certs:ro \
              nginx:alpine nginx -t"

      - name: Docker compose deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /app/gateway
            docker network create web 2>/dev/null || true
            # --force-recreate 是必须的，不是保险：nginx.conf 是单文件 bind mount，
            # 绑的是 inode，而 rsync 改文件是「写临时文件再改名」——inode 变了，
            # 旧容器仍读着旧文件，光 `up -d` 不会重建，改了配置也静默不生效。
            docker compose up -d --force-recreate
