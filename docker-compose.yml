services:
  # ---- 统一网关：独占 80 / 443，按路径把请求分发到各项目 ----
  #
  # 刻意不写 depends_on：网关不依赖任何项目容器存在。
  # 因为 nginx.conf 里用的是「变量形式的 proxy_pass + Docker 内置 DNS」，
  # 域名解析推迟到每次请求，所以某个项目没起、正在重建、或者被删掉，
  # 都只影响它自己那条路径，不会拖垮网关，也不会拖垮别的项目。
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 路由表：被 80 兜底块和 443 块各 include 一次
      - ./routes.inc:/etc/nginx/routes.inc:ro
      # TLS 证书。宿主机目录需先存在并放好文件（见 README「HTTPS 证书」）；
      # 若目录为空，nginx 会因读不到证书而启动失败。
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    # 打容器自己的 /healthz（见 routes.inc），只验证 nginx 在正常应答。
    # 刻意不探上游项目路径：上游挂掉不该把网关判成不健康。
    # -f 是关键：没有它的话 404 也算「成功」，健康检查就永远绿了。
    # nginx:alpine 自带 /usr/bin/curl（实测非软链，是装进镜像的），没有额外依赖。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - web

networks:
  # 与各项目共享的外部网络，首次需在服务器上 docker network create web
  web:
    external: true
