# 统一网关：独占宿主机 80 / 443，按路径把请求分发到各个项目。
#
# ── 新增一个项目时，只需两步 ──────────────────────────────────────
#   1) 让该项目接入外部网络 web，并用别名 <项目名>-web / <项目名>-api
#      把「前端 nginx」和「后端 API」暴露出来（写法见 chat/xianji 的 compose）
#   2) 在 routes.inc 里照抄一段 location，把路径指到上面那两个别名
#      然后 push 本仓库。其它项目不受影响，也不会重启。
#
# ── 为什么路由单独放 routes.inc ───────────────────────────────────
# 80 兜底块和每个 443 域名块都要用同一套路由，所以抽成 routes.inc 各 include
# 一次。写两份的话，新增项目时容易只改一边，出现「有的入口能用、有的不能」。
#
# ── 为什么 proxy_pass 要写成变量形式 ──────────────────────────────
# nginx 对 proxy_pass 里的字面主机名是「启动时解析一次」。那样的话任何一个
# 项目没起，网关会直接启动失败；而且对方容器重建换了 IP 之后，网关会一直
# 连不上旧的 IP。改成变量 + Docker 内置 DNS 后，解析推迟到每次请求，
# 各项目之间彻底解耦，随起随停互不干扰。
#
# ── 加一个域名 ───────────────────────────────────────────────────
# 证书一张一张签，每个域名一份，所以「一个域名一个 server 块」——nginx 按 SNI
# 挑块，块里的 ssl_certificate 就是该域名的证书。加域名 = 加一个 443 块
# + 把域名补进上面那个 80 跳转块的 server_name。
#
# ── 证书放哪 ─────────────────────────────────────────────────────
# 宿主机 /app/gateway/certs/ → 容器 /etc/nginx/certs/（只读）。
# 私钥不能进 git，所以 certs/ 被 .gitignore 忽略，CI 的 rsync 也刻意
# --exclude='certs'，push 既不会上传也不会用 --delete 抹掉它。
# 续期流程见 README「HTTPS 证书」。

# ── http 级公共设置 ──────────────────────────────────────────────
# 本文件被 include 进 nginx.conf 的 http 块，所以写到 server 外面的指令
# 对所有 server 块生效。放这儿是为了不在每个域名块里重复一遍。
ssl_protocols TLSv1.2 TLSv1.3;
# TLS 会话复用：完整握手只在首次发生，之后走缓存
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1h;

# 上传/图片走网关，留足体积
client_max_body_size 50M;

# Docker 内置 DNS。valid=10s 让容器重建换 IP 后最多 10 秒自动生效
resolver 127.0.0.11 valid=10s ipv6=off;

# ── 80：所有域名一律升级到 HTTPS ─────────────────────────────────
server {
    listen 80;
    server_name www.liujn.fun liujn.fun www.jnnnn.top jnnnn.top;

    return 301 https://$host$request_uri;
}

# ── 80 兜底：未匹配的 Host（比如直接打裸 IP）保持 HTTP 原样可用 ────
# 不做跳转：这里会落到任何未知 Host 上，它们没有对应证书，跳 HTTPS 只会报错。
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/routes.inc;
}

# ── 443：HTTPS 主入口，一个域名一个块 ────────────────────────────
# 每个域名一份证书，nginx 按 SNI 挑块。第一个块兼任 default_server：没带 SNI、
# 或 SNI 是不认识的域名时落到它身上 —— 那种情况本来就拿不到匹配的证书，
# 给谁都一样，所以挑哪个块当默认都无所谓。
server {
    listen 443 ssl default_server;
    http2 on;
    server_name www.liujn.fun liujn.fun;

    ssl_certificate     /etc/nginx/certs/www.liujn.fun.pem;
    ssl_certificate_key /etc/nginx/certs/www.liujn.fun.key;

    include /etc/nginx/routes.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.jnnnn.top jnnnn.top;

    ssl_certificate     /etc/nginx/certs/www.jnnnn.top.pem;
    ssl_certificate_key /etc/nginx/certs/www.jnnnn.top.key;

    include /etc/nginx/routes.inc;
}
