# 统一网关：独占宿主机 80 端口，按路径把请求分发到各个项目。
#
# ── 新增一个项目时，只需两步 ──────────────────────────────────────
#   1) 让该项目接入外部网络 web，并用别名 <项目名>-web / <项目名>-api
#      把「前端 nginx」和「后端 API」暴露出来（写法见 chat/xianji 的 compose）
#   2) 在本文件里照抄一段 location，把路径指到上面那两个别名
#   然后 push 本仓库。其它项目不受影响，也不会重启。
#
# ── 为什么 proxy_pass 要写成变量形式 ──────────────────────────────
# nginx 对 proxy_pass 里的字面主机名是「启动时解析一次」。那样的话任何一个
# 项目没起，网关会直接启动失败；而且对方容器重建换了 IP 之后，网关会一直
# 连不上旧的 IP。改成变量 + Docker 内置 DNS 后，解析推迟到每次请求，
# 各项目之间彻底解耦，随起随停互不干扰。

server {
    listen 80;
    server_name _;

    # Docker 内置 DNS。valid=10s 让容器重建换 IP 后最多 10 秒自动生效
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 上传/图片走网关，留足体积
    client_max_body_size 50M;

    # 根路径导向弦集
    location = / {
        return 302 /guitar/;
    }

    # ============ 弦集（xianji） ============

    location = /guitar {
        return 301 /guitar/;
    }

    location /guitar/ {
        set $upstream http://xianji-web:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /guitar-api/ {
        set $upstream http://xianji-api:5000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /guitar-images/ {
        set $upstream http://xianji-api:5000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============ 对话（chat） ============

    location = /chat {
        return 301 /chat/;
    }

    location /chat/ {
        set $upstream http://chat-web:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE 流式接口：必须关闭缓冲，否则回复会攒成一坨再返回，看不到打字机效果
    location /chat-api/ {
        set $upstream http://chat-api:5001;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    # ── 新项目照抄下面这段（记得 return 301 那段也加上）────────────
    # location = /<路径> {
    #     return 301 /<路径>/;
    # }
    #
    # location /<路径>/ {
    #     set $upstream http://<项目名>-web:80;
    #     proxy_pass $upstream;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
    #
    # location /<路径>-api/ {
    #     set $upstream http://<项目名>-api:<后端端口>;
    #     proxy_pass $upstream;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}
